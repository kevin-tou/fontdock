name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  combos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Registry schema
        run: node scripts/validate.mjs
      - name: CDN and specimen URLs
        run: node scripts/validate.mjs --cdn
